name: build-and-bundle-apk

# Builds the Svelte + JS web bundle (0 TypeScript), syncs Capacitor Android with
# the custom Kotlin plugins, compiles the .APK via Gradle, and bundles it into
# static/releases/atmosvigil-release.apk for the Vercel deployment.
#
# The APK is rebuilt on every push to main so the one-tap download button always
# resolves to a freshly-compiled artifact (zero 404s).
#
# The checked-in android/ directory only ships the plugin sources
# (android/app/src/main/java/com/atmosvigil/meteo/*.kt) and the MainActivity
# registration template (android/capacitor/MainActivity.kt) — `npx cap add
# android` generates the native project at build time.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  # Capacitor 8 compiles with Java 21 (sourceCompatibility/targetCompatibility
  # VERSION_21 in the generated capacitor modules + app) — JDK 17 cannot build it.
  JAVA_VERSION: '21'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle (zero TypeScript)
        run: npm run build

      - name: Move plugin sources aside (project is generated at build time)
        run: |
          mv android android.plugins-src

      - name: Generate Android Capacitor project
        run: npx cap add android

      - name: Inject Kotlin plugins + MainActivity registration
        run: |
          PLUGIN_DIR="android/app/src/main/java/com/atmosvigil/meteo"
          mkdir -p "$PLUGIN_DIR"
          cp -r android.plugins-src/app/src/main/java/com/atmosvigil/meteo/* "$PLUGIN_DIR/"
          cp android.plugins-src/capacitor/MainActivity.kt "$PLUGIN_DIR/MainActivity.kt"
          rm -f "$PLUGIN_DIR/MainActivity.java"
          # The aeroacoustic anemometer streams microphone audio from a Kotlin
          # plugin — allow it in the AndroidManifest that cap sync regenerated.
          if ! grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />#' android/app/src/main/AndroidManifest.xml
          fi
          rm -rf android.plugins-src
          ls -R "$PLUGIN_DIR"
          cat android/app/src/main/AndroidManifest.xml

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Apply Kotlin support to the generated app
        # The capacitor template is Java-only — without this, the in-tree
        # Kotlin plugins (BarometerThermoPlugin, AeroAcousticAnemometerPlugin)
        # and the Kotlin MainActivity are never compiled. Kotlin 2.3.0 is the
        # AGP 8.13-tested pairing.
        run: |
          printf '\napply plugin: "kotlin-android"\n\nandroid {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_21\n        targetCompatibility JavaVersion.VERSION_21\n    }\n}\n\ndependencies {\n    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.0"\n}\n' >> android/app/build.gradle
          sed -i "s|classpath 'com.android.tools.build:gradle:8.13.0'|classpath 'com.android.tools.build:gradle:8.13.0'\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0'|" android/build.gradle
          grep -n -i "kotlin" android/build.gradle android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          java -version
          chmod +x gradlew
          ./gradlew --version
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          ./gradlew :app:assembleRelease --no-daemon --stacktrace || echo 'Release signing not configured — debug APK produced'

      - name: Stage release artifact (static/releases/ — served by the Vercel deploy)
        run: |
          mkdir -p static/releases
          APK_SRC=""
          APK_SRC=$(find android -name "*.apk" -path "*outputs*" | grep -i release | head -n 1 || true)
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find android -name "*.apk" -path "*outputs*" | grep -i debug | head -n 1 || true)
          fi
          if [ -z "$APK_SRC" ]; then
            echo 'ERROR: no APK produced by Gradle' >&2
            find android -name "*.apk" -path "*outputs*" -print || true
            exit 1
          fi
          cp "$APK_SRC" static/releases/atmosvigil-release.apk
          sha256sum static/releases/atmosvigil-release.apk > static/releases/atmosvigil-release.sha256
          ls -lh static/releases/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: atmosvigil-release-apk
          path: static/releases/
          retention-days: 30

      - name: Commit bundled APK on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/releases/atmosvigil-release.apk static/releases/atmosvigil-release.sha256
          git diff --cached --quiet || git commit -m "chore: refresh bundled APK artifact [skip ci]"
          git push
